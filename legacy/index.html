/* ══════════════════════════════════════════════════════

function AnimatedSection({ children, className = "", id }) {
  const ref    = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-80px 0px" });
  return (
    <motion.div ref={ref} id={id} initial="hidden"
      animate={inView ? "visible" : "hidden"} variants={stagger} className={className}>
      {children}
    </motion.div>
  );
}

function RolePill({ role, amber }) {

  );
}

      style={{ fontSize:"clamp(2.6rem,7vw,5.5rem)", letterSpacing:"-0.025em" }}>

/* ══════════════════════════════════════════════════════
   CATALOG / BOUNCES
   ══════════════════════════════════════════════════════ */
function Catalog() {
  const [beats,   setBeats]   = useState(FALLBACK_BEATS);
  const [search,  setSearch]  = useState("");
  const [apiLive, setApiLive] = useState(false);

  useEffect(() => {
    const ctrl = new AbortController();
    fetch("http://localhost:5050/api/beats", { signal: ctrl.signal })
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(data => { if (Array.isArray(data) && data.length) { setBeats(data); setApiLive(true); } })
      .catch(() => {});
    return () => ctrl.abort();
  }, []);

  const filtered = beats.filter(b => {
    const q = search.toLowerCase();
    return (b.name || b.filename || "").toLowerCase().includes(q)
        || (b.collaborators || b.artists || "").toLowerCase().includes(q);
  });

  return (
    <section id="catalog" className="bg-[#070707] py-28 md:py-36 px-6">
      <div className="max-w-7xl mx-auto">

        <AnimatedSection className="mb-14">
          <SectionLabel
            eyebrow="Archive"
            headline="Bounces"
            body={`A living archive of ${beats.length.toLocaleString()}+ original productions — beats, records, and sessions from the vault.${
              apiLive ? "" : "  (Preview — connect S3 Hub for full playback)"}`}
          />
        </AnimatedSection>

        {/* Search */}
        <div className="relative max-w-sm mb-3">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-white/25 pointer-events-none">
            <ISearch size={13} />
          </span>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search title, collaborator…"
            className="w-full bg-white/[0.04] border border-white/[0.08] text-white text-sm pl-10 pr-10 py-3 placeholder:text-white/20 focus:outline-none focus:border-amber-400/40 transition-colors duration-200" />
          <AnimatePresence>
            {search && (
              <motion.button initial={{ opacity:0, scale:0.8 }} animate={{ opacity:1, scale:1 }} exit={{ opacity:0, scale:0.8 }}
                onClick={() => setSearch("")}
                className="absolute right-4 top-1/2 -translate-y-1/2 text-white/25 hover:text-white">
                <IClose size={13} />
              </motion.button>
            )}
          </AnimatePresence>
        </div>

        <p className="text-white/20 text-[10px] tracking-[0.2em] uppercase mb-8">
          {filtered.length.toLocaleString()} tracks
        </p>

        <AnimatedSection className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-px bg-white/[0.04]">
          {filtered.slice(0, 60).map((beat, i) => (
            <BeatCard key={beat.id ?? i} beat={beat} index={i} />
          ))}
        </AnimatedSection>

        {filtered.length > 60 && (
          <p className="text-center text-white/20 text-[10px] tracking-[0.2em] uppercase mt-10">
            Showing 60 of {filtered.length.toLocaleString()} — open S3 Hub for full library
          </p>
        )}
      </div>
    </section>
  );
}

function BeatCard({ beat, index }) {
  const name   = beat.name || beat.filename || "untitled";
  const bpm    = beat.bpm ?? null;
  const collab = beat.collaborators || beat.artists || "—";
  return (
    <motion.div variants={fadeUp} custom={index % 6}
      className="bg-[#0C0C0C] p-5 group hover:bg-[#131313] transition-colors duration-200 cursor-default">
      <div className="h-px w-5 bg-amber-400/35 mb-4 group-hover:w-10 group-hover:bg-amber-400 transition-all duration-300 ease-out" />
      <p className="text-white text-sm font-medium leading-snug capitalize truncate mb-3">{name}</p>
      <div className="space-y-1">
        {bpm && <p className="text-white/25 text-[10px] tracking-wide">{bpm} bpm</p>}
        <p className="text-white/20 text-[10px] truncate">{collab}</p>
      </div>
    </motion.div>
  );
}

}

  return (
    <motion.div ref={ref} initial={{ opacity:0, y:32 }}
      animate={inView ? { opacity:1, y:0 } : {}}
      transition={{ duration:0.7, ease }}
      className="relative overflow-hidden border border-white/[0.08] hover:border-amber-400/20 transition-colors duration-300 group mb-2">

      <div className="absolute inset-0 pointer-events-none"
        style={{ background:"linear-gradient(135deg,rgba(251,191,36,0.04) 0%,transparent 60%)" }} />

      <div className="relative flex flex-col md:flex-row items-start md:items-center gap-8 p-8 md:p-12">

        {/* Cover */}
        <div className="relative w-28 h-28 md:w-36 md:h-36 flex-shrink-0 bg-white/[0.04] border border-white/[0.06] overflow-hidden flex items-center justify-center">
          <img src={credit.cover} alt={credit.title}
            className="w-full h-full object-cover opacity-75 group-hover:opacity-100 transition-opacity duration-300"
            onError={e => { e.currentTarget.style.display="none"; }} />
          <span className="absolute top-0 left-0 bg-amber-400 text-black text-[8px] font-black tracking-[0.12em] uppercase px-2 py-0.5">
            Featured
          </span>
        </div>

        {/* Info */}
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-3 mb-3">
            <span className="text-amber-400 text-[10px] tracking-[0.22em] uppercase">{credit.year}</span>
            <span className="text-white/15">·</span>
            <span className="text-white/30 text-[10px] tracking-wider">{credit.genre}</span>
          </div>
          <h3 className="text-white font-black uppercase leading-tight mb-1"
            style={{ fontSize:"clamp(1.4rem,3.5vw,2.2rem)", letterSpacing:"-0.01em" }}>
            {credit.title}
          </h3>
          <p className="text-white/45 text-sm mb-1">{credit.artist}</p>
          <p className="text-white/25 text-xs mb-5">ft. {credit.featuring}</p>
          <p className="text-white/30 text-sm mb-6 max-w-md leading-relaxed">{credit.description}</p>
          <div className="flex flex-wrap items-center gap-2">
            {credit.roles.map(r => <RolePill key={r} role={r} amber />)}
            {credit.spotifyUrl && (
              <a href={credit.spotifyUrl} target="_blank" rel="noopener noreferrer"
                className="inline-flex items-center gap-1.5 text-[10px] text-white/25 hover:text-white tracking-[0.12em] uppercase transition-colors ml-2">
                <IExternal size={11} /> Spotify
              </a>
            )}
          </div>
        </div>
      </div>
    </motion.div>
  );
}

function CreditRow({ credit, index, isOpen, onToggle }) {
  return (
    <motion.div variants={fadeUp} custom={index}>
      <button onClick={onToggle}
        className="w-full flex items-center gap-6 py-5 text-left group hover:bg-white/[0.015] transition-colors duration-150 px-1">
        <span className="text-white/20 text-[10px] tracking-[0.15em] uppercase w-10 flex-shrink-0 tabular-nums">
          {credit.year}
        </span>
        <div className="flex-1 min-w-0">
          <span className="text-white font-semibold text-sm truncate block">{credit.title}</span>
          <span className="text-white/35 text-xs">{credit.artist}</span>
        </div>
        <div className="hidden md:flex items-center gap-2 flex-shrink-0">
          {credit.roles.map(r => <RolePill key={r} role={r} amber={isOpen} />)}
        </div>
        <span className="hidden lg:block text-white/20 text-[10px] tracking-wider flex-shrink-0 w-36 text-right">
          {credit.genre}
        </span>
        <motion.span animate={{ rotate: isOpen ? 45 : 0 }} transition={{ duration:0.2 }}
          className="flex-shrink-0 text-white/25 ml-2">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5">
            <line x1="7" y1="0" x2="7" y2="14"/>
            <line x1="0" y1="7" x2="14" y2="7" style={{ opacity: isOpen ? 0 : 1, transition:"opacity 0.2s" }}/>
          </svg>
        </motion.span>
      </button>

      <AnimatePresence initial={false}>
        {isOpen && (
          <motion.div key="panel"
            initial={{ height:0, opacity:0 }} animate={{ height:"auto", opacity:1 }} exit={{ height:0, opacity:0 }}
            transition={{ duration:0.28, ease }} className="overflow-hidden">
            <div className="pl-16 pr-4 pb-6 pt-1 border-l border-amber-400/15 ml-1">
              <p className="text-white/25 text-xs mb-1">ft. {credit.featuring}</p>
              <p className="text-white/35 text-sm leading-relaxed max-w-xl mb-4">{credit.description}</p>
              <div className="flex flex-wrap gap-2 mb-3 md:hidden">
                {credit.roles.map(r => <RolePill key={r} role={r} amber />)}
              </div>
              {credit.spotifyUrl && (
                <a href={credit.spotifyUrl} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1.5 text-[10px] text-amber-400/50 hover:text-amber-400 tracking-[0.12em] uppercase transition-colors">
                  <IExternal size={11} /> Listen on Spotify
                </a>
              )}
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </motion.div>
  );
}
